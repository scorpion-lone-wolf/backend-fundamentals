syntax = "proto3";

package order;

service OrderService{
    rpc GetUsersOrders(GetUsersOrdersRequest) returns (GetUsersOrdersResponse) ;
}

message GetUsersOrdersRequest{
   int32 userId = 1;
}
message GetUsersOrdersResponse{
    string status = 1;
    repeated Order orders = 2;
}

// schemas
message Order{
    int32 id = 1;
    string item = 2;
    double price = 3;
}


