name: "Bloggy app"
on:
  push:
    branches: ["master"]
    paths:
      # This path filter ensures the pipeline only triggers when files inside this specific folder changes.
      - "backend-fundamentals/week-14.1(CI-CD)/**"
  pull_request:
    branches: ["master"]
    paths:
      - "backend-fundamentals/week-14.1(CI-CD)/**"

jobs:
  # ==========================================
  # JOB 1: INSTALLATION & VERIFICATION
  # ==========================================
  install-dep:
    runs-on: ubuntu-latest
    steps:
      # Step 1.1: Clone the repository onto this virtual machine.
      # The virtual machine starts completely empty. It does not have your project files.
      # This official action clones your git repository onto the runner machine so following steps can read your code.
      - name: Checkout repository code
      - uses: actions/checkout@v4

      # Step 1.2: Install Node 22 and set up the global npm cache.
      # Installs the node runtime environment onto the virtual machine runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          # CACHE: Tells GitHub to store your downloaded 'node_modules' directory in its secure cloud storage.
          # On future runs, it restores these modules instantly rather than downloading them over the internet.
          cache: npm
          # CACHE DEPENDENCY PATH: Tells GitHub where your 'package-lock.json' file is located.
          # GitHub creates a unique signature (hash) of this file. If the file doesn't change, it reuses the cache.
          # If you install a new package, this file changes, and GitHub knows to bypass the cache and do a fresh install.
          cache-dependency-path: backend-fundamentals/week-14.1(CI-CD)/package-lock.json

      # Step 1.3: Run clean install to verify package-lock.json is healthy.
      - name: Install dependencies
        run: npm ci

  # ==========================================
  # JOB 2: CODE QUALITY CHECK (LINT)
  # ==========================================
  lint:
    runs-on: ubuntu-latest
    # DEPENDENCY: Tells GitHub to wait for the 'install-dep' job to pass.
    # If dependencies fail to install, this job won't waste time running.
    needs: install-dep
    steps:
      # CRITICAL: Because this is a brand new, isolated virtual machine,
      # we MUST check out the code and set up Node all over again.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm # Pulls the node_modules straight from the cache created in Job 1
          cache-dependency-path: backend-fundamentals/week-14.1(CI-CD)/package-lock.json
      - name: Run Linter 🔍
        run: npm run lint

  # ==========================================
  # JOB 3: AUTOMATED TESTING
  # ==========================================
  test:
    runs-on: ubuntu-latest
    # DEPENDENCY: Runs in parallel with the 'lint' job, but only after 'install-dep' passes.
    needs: install-dep
    steps:
      # Spin up the environment fresh for testing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm # Restores dependencies instantly from the shared cache
          cache-dependency-path: backend-fundamentals/week-14.1(CI-CD)/package-lock.json
      - name: Run Tests 🧪
        run: npm run test

  # ==========================================
  # JOB 4: PRODUCTION COMPILATION (BUILD)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    # DEPENDENCY: Runs in parallel with lint and test, only after 'install-dep' passes.
    needs: install-dep
    steps:
      # Spin up the environment fresh for the build step
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend-fundamentals/week-14.1(CI-CD)/package-lock.json
      - name: Build app 🏗️
        run: npm run build
